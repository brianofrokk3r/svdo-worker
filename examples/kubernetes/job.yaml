apiVersion: v1
kind: ConfigMap
metadata:
  name: svdo-worker-meter-config
data:
  # Keep non-secret meter metadata in a ConfigMap. Use a Secret instead if an
  # environment-specific meter config contains credentials or sensitive policy.
  meter.yaml: |
    runtime:
      name: svdo-worker
      workspace_env: SVDO_WORKSPACE
      home_env: SVDO_HOME
      temp_env: SVDO_TMPDIR
    output:
      mode: file
      directory: "${SVDO_TMPDIR}/meter"
      format: jsonl
---
apiVersion: batch/v1
kind: Job
metadata:
  name: svdo-worker-sample
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/svdo-worker-base:latest
          imagePullPolicy: IfNotPresent
          args:
            - Inspect the workspace and summarize the current repository status.
          env:
            - name: SVDO_WORKSPACE
              value: /workspace
            - name: SVDO_HOME
              value: /home/svdo
            - name: SVDO_TMPDIR
              value: /tmp/svdo-worker
            - name: SVDO_METER_CONFIG
              value: /etc/svdo-worker/meter.yaml
            - name: SVDO_METER_BIN
              value: /usr/local/bin/svdo-meter
            - name: SVDO_WORKER_MODE
              value: harness
            - name: SVDO_METER_EXTRA_ARGS
              value: ""
            - name: SVDO_AGENT
              value: codex
            - name: SVDO_TICKET_ID
              value: local-sample
            # Use a Secret-mounted file or secretKeyRef values when meter config
            # or provider configuration contains sensitive data.
            # Inject provider credentials with a Secret in the target cluster.
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: agent-credentials
            #       key: openai-api-key
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Project source for this work unit. This is the only required
            # source mount; Kubernetes or the invoking platform prepares it.
            - name: workspace
              mountPath: /workspace
            # Agent credentials, caches, and provider session state.
            - name: home
              mountPath: /home/svdo
            # Transient files and meter output root.
            - name: tmp
              mountPath: /tmp/svdo-worker
            - name: meter-config
              mountPath: /etc/svdo-worker/meter.yaml
              subPath: meter.yaml
              readOnly: true
      volumes:
        # Replace this with the workspace volume strategy used by the operator:
        # PVC, CSI volume, initContainer-populated emptyDir, or pre-mounted repo.
        - name: workspace
          persistentVolumeClaim:
            claimName: svdo-workspace
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: meter-config
          configMap:
            name: svdo-worker-meter-config
            defaultMode: 0444
